<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161a; --panel:#1c1f26; --panel-2:#242833; --border:#313742; --border-soft:#282d37;
    --text:#e9e8e4; --text-muted:#8b91a0; --text-dim:#5c6272; --accent:#f2a93b;
    --accent-soft:rgba(242,169,59,0.14); --accent-dim:#8a6a2f; --collider:#a78bfa; --trigger:#4fd1c5;
    --danger:#ef6461; --danger-soft:rgba(239,100,97,0.14); --grid-line:#20242c;
    --grid-line-major:#2a2f3a; --grid-axis:#454c5c;
  }
  *{box-sizing:border-box;} html,body{height:100%;margin:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;overflow:hidden;font-size:13px;}
  input,select,button,textarea{font-family:inherit;font-size:inherit;} ::selection{background:var(--accent-soft);}
  .brand-input{width:120px;background:transparent;border:none;outline:none;color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:10px;padding:0;margin:0;}
  .brand-input:focus{color:var(--text);}
  .app{display:grid;grid-template-columns:250px 1fr 320px;grid-template-rows:52px 1fr 26px;grid-template-areas:"topbar topbar topbar" "left canvas right" "left status right";height:100vh;width:100vw;}
  .topbar{grid-area:topbar;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--border);white-space:nowrap;overflow-x:auto;}
  .brand{display:flex;align-items:center;gap:8px;padding-right:10px;margin-right:4px;border-right:1px solid var(--border-soft);}
  .brand-mark{width:18px;height:18px;border-radius:3px;background:var(--accent);position:relative;flex-shrink:0;}
  .brand-mark::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:var(--bg);transform:translate(-50%,-50%);}
  .brand-name{font-weight:700;font-size:14px;letter-spacing:0.2px;}
  .tbtn{display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:7px 11px;border-radius:6px;cursor:pointer;font-size:12.5px;font-weight:500;transition:background .12s,border-color .12s;}
  .tbtn:hover{background:#2b303c;border-color:#3c4250;} .tbtn:active{transform:translateY(1px);} .tbtn.primary{background:var(--accent);color:#1a1305;border-color:var(--accent);font-weight:600;} .tbtn.primary:hover{background:#f5b654;} .tbtn.danger{color:var(--danger);} .tbtn.danger:hover{background:var(--danger-soft);border-color:var(--danger);}
  .tsep{width:1px;height:22px;background:var(--border-soft);margin:0 2px;flex-shrink:0;} .tgroup{display:flex;align-items:center;gap:4px;flex-shrink:0;}
  .toggle{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;border:1px solid var(--border);cursor:pointer;user-select:none;font-size:12px;color:var(--text-muted);background:var(--panel-2);}
  .toggle.on{color:var(--text);border-color:var(--accent-dim);background:var(--accent-soft);} .toggle input{display:none;} .spacer{flex:1;} .fileinput{display:none;}
  .left{grid-area:left;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;}
  .panel-head{padding:12px 14px 10px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between;}
  .panel-head h2{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-muted);font-weight:600;}
  .count-badge{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-dim);background:var(--panel-2);padding:2px 6px;border-radius:10px;}
  .obj-list{flex:1;overflow-y:auto;padding:6px;} .obj-item{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:7px;cursor:pointer;border:1px solid transparent;margin-bottom:2px;} .obj-item:hover{background:var(--panel-2);} .obj-item.selected{background:var(--accent-soft);border-color:var(--accent-dim);}
  .obj-thumb{width:28px;height:28px;border-radius:5px;flex-shrink:0;background:var(--panel-2);border:1px solid var(--border-soft);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--text-dim);overflow:hidden;}
  .obj-info{flex:1;min-width:0;} .obj-title{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .obj-meta{font-size:10.5px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;}
  .obj-del{opacity:0;width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:5px;color:var(--text-dim);} .obj-item:hover .obj-del{opacity:1;} .obj-del:hover{background:var(--danger-soft);color:var(--danger);} .empty-hint{padding:22px 16px;color:var(--text-dim);font-size:12px;line-height:1.6;text-align:center;}
  .canvas-wrap{grid-area:canvas;position:relative;overflow:hidden;background:var(--bg);} svg#stage{width:100%;height:100%;display:block;cursor:default;} svg#stage.panning{cursor:grabbing;}
  .zoom-controls{position:absolute;bottom:14px;right:14px;display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:4px;} .zoom-controls button{width:28px;height:28px;border:none;background:transparent;color:var(--text-muted);border-radius:5px;cursor:pointer;font-size:15px;} .zoom-controls button:hover{background:var(--panel-2);color:var(--text);} .zoom-pct{font-family:'JetBrains Mono',monospace;font-size:9.5px;text-align:center;color:var(--text-dim);padding:2px 0;}
  .status{grid-area:status;background:var(--panel);border-right:1px solid var(--border);border-top:1px solid var(--border-soft);display:flex;align-items:center;gap:16px;padding:0 14px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-dim);} .status b{color:var(--text-muted);font-weight:500;}
  .right{grid-area:right;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;} .props{flex:1;overflow-y:auto;padding:14px;} .prop-empty{padding:40px 20px;text-align:center;color:var(--text-dim);font-size:12.5px;line-height:1.7;}
  .field{margin-bottom:12px;} .field label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:5px;font-weight:600;} .field input[type=text],.field input[type=number],.field select{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:7px 9px;border-radius:6px;outline:none;} .field input:focus,.field select:focus{border-color:var(--accent-dim);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;} .fieldgroup{border:1px solid var(--border-soft);border-radius:8px;padding:10px 10px 2px;margin-bottom:14px;background:rgba(255,255,255,0.012);} .fieldgroup-title{font-size:10.5px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;margin-bottom:9px;display:flex;align-items:center;gap:6px;} .fieldgroup-title .dot{width:7px;height:7px;border-radius:50%;}
  .sprite-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;} .sprite-preview{width:56px;height:56px;border-radius:8px;background:var(--panel-2);border:1px dashed var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center;color:var(--text-dim);font-size:9px;cursor:pointer;text-align:center;overflow:hidden;} .sprite-preview:hover{border-color:var(--accent-dim);} .sprite-actions{flex:1;display:flex;flex-direction:column;gap:6px;} .mini-btn{background:var(--panel-2);border:1px solid var(--border);color:var(--text-muted);padding:5px 8px;border-radius:5px;cursor:pointer;font-size:11px;text-align:center;} .mini-btn:hover{color:var(--text);border-color:#3c4250;}
  .prop-actions{display:flex;gap:8px;margin-top:6px;padding-top:14px;border-top:1px solid var(--border-soft);} .prop-actions .tbtn{flex:1;justify-content:center;} .hint{font-size:10.5px;color:var(--text-dim);margin-top:3px;line-height:1.5;}
  ::-webkit-scrollbar{width:9px;height:9px;} ::-webkit-scrollbar-track{background:transparent;} ::-webkit-scrollbar-thumb{background:#333846;border-radius:5px;} ::-webkit-scrollbar-thumb:hover{background:#3f4554;}
  .toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:9px 16px;border-radius:8px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,0.4);} .toast.show{opacity:1;transform:translateX(-50%) translateY(0);} .obj-label{font-family:'Inter',sans-serif;pointer-events:none;user-select:none;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><div class="brand-mark"></div><div><div class="brand-name">Map Editor</div><input type="text" id="projName" class="brand-input" value="untitled" placeholder="Map name"></div></div>
    <button class="tbtn primary" id="btnNew">+ New Object</button><div class="tsep"></div>
    <div class="tgroup"><button class="tbtn" id="btnLoadProject">Open Project</button><button class="tbtn" id="btnSaveProject">Save Project</button></div><div class="tsep"></div>
    <div class="tgroup"><button class="tbtn" id="btnImportGame">Import JSON</button><button class="tbtn primary" id="btnExportGame">Export JSON</button></div>
    <input type="file" id="fileProject" class="fileinput" accept="application/json"><input type="file" id="fileGameJson" class="fileinput" accept="application/json"><input type="file" id="fileSprite" class="fileinput" accept="image/*">
    <div class="spacer"></div><label class="toggle" id="toggleGrid"><input type="checkbox" checked><span>Grid</span></label><label class="toggle on" id="toggleColliders"><input type="checkbox" checked><span>Colliders</span></label><label class="toggle on" id="toggleTriggers"><input type="checkbox" checked><span>Triggers</span></label><label class="toggle" id="toggleSnap"><input type="checkbox"><span>Snap</span></label>
  </div>
  <div class="left"><div class="panel-head"><h2>Objects</h2><span class="count-badge" id="objCount">0</span></div><div class="obj-list" id="objList"></div></div>
  <div class="canvas-wrap"><svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg><div class="zoom-controls"><button id="zoomIn">+</button><div class="zoom-pct" id="zoomPct">100%</div><button id="zoomOut">–</button><button id="zoomReset" title="Reset view">⤾</button></div></div>
  <div class="status"><span>x: <b id="curX">0.00</b></span><span>y: <b id="curY">0.00</b></span><span style="flex:1"></span><span id="statusMsg"></span></div>
  <div class="right"><div class="panel-head"><h2>Properties</h2></div><div class="props" id="props"></div></div>
</div><div class="toast" id="toast"></div>
<script>
(function(){
  "use strict";
  let objects=[]; let selectedId=null; let nextLocalId=1; let mapTitle="Map1";
  const mapTitleInput=document.getElementById("projName"); mapTitleInput.value=mapTitle; mapTitleInput.addEventListener("input",()=>{mapTitle=mapTitleInput.value;autosave();});
  const view={scale:40,panX:0,panY:0,cx:0,cy:0}; const flags={showGrid:true,showColliders:true,showTriggers:true,snap:false}; let drag=null,panning=null;
  const svg=document.getElementById('stage'),NS='http://www.w3.org/2000/svg';
  function uid(){return 'o'+(nextLocalId++)+'_'+Math.random().toString(36).slice(2,8);} function round2(n){return Math.round(n*100)/100;}
  function nextSortOrder(){return objects.reduce((m,o)=>Math.max(m,o.sortingOrder||0),0)+1;}
  function defaultObject(pos){return {id:uid(),title:"New Object",position:{x:round2(pos?.x??0),y:round2(pos?.y??0)},size:{x:1,y:1},imageAspect:1,colliderShape:"box",triggerSize:{x:1,y:1},triggerOffset:{x:0,y:0},colliderSize:{x:0,y:0},colliderOffset:{x:0,y:0},hideCriteria:0,sortingOrder:nextSortOrder(),image:[],script:"",manually_touchable:false,imageData:null};}
  function normalizeObjectImage(o){o.image=[];return o;}
  function resize(){const rect=svg.getBoundingClientRect();view.cx=rect.width/2;view.cy=rect.height/2;render();}
  function worldToScreen(x,y){return{x:view.cx+view.panX+x*view.scale,y:view.cy+view.panY-y*view.scale};} function screenToWorld(sx,sy){return{x:(sx-view.cx-view.panX)/view.scale,y:-(sy-view.cy-view.panY)/view.scale};} function eventToSvgPoint(evt){const rect=svg.getBoundingClientRect();return{x:evt.clientX-rect.left,y:evt.clientY-rect.top};}
  function el(tag,attrs){const e=document.createElementNS(NS,tag);if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}
  function render(){svg.innerHTML='';const rect=svg.getBoundingClientRect(),w=rect.width,h=rect.height;if(flags.showGrid)drawGrid(w,h);drawAxes(w,h);for(const obj of [...objects].sort((a,b)=>(a.sortingOrder||0)-(b.sortingOrder||0)))drawObject(obj);drawOrigin();document.getElementById('zoomPct').textContent=Math.round(view.scale/40*100)+'%';}
  function drawGrid(w,h){const tl=screenToWorld(0,0),br=screenToWorld(w,h),minX=Math.floor(Math.min(tl.x,br.x))-1,maxX=Math.ceil(Math.max(tl.x,br.x))+1,minY=Math.floor(Math.min(tl.y,br.y))-1,maxY=Math.ceil(Math.max(tl.y,br.y))+1;if((maxX-minX)<400)for(let x=minX;x<=maxX;x++){const p=worldToScreen(x,0),major=x%5===0;svg.appendChild(el('line',{x1:p.x,y1:0,x2:p.x,y2:h,stroke:major?'var(--grid-line-major)':'var(--grid-line)','stroke-width':1}));}if((maxY-minY)<400)for(let y=minY;y<=maxY;y++){const p=worldToScreen(0,y),major=y%5===0;svg.appendChild(el('line',{x1:0,y1:p.y,x2:w,y2:p.y,stroke:major?'var(--grid-line-major)':'var(--grid-line)','stroke-width':1}));}}
  function drawAxes(w,h){const o=worldToScreen(0,0);svg.appendChild(el('line',{x1:0,y1:o.y,x2:w,y2:o.y,stroke:'var(--grid-axis)','stroke-width':1.4}));svg.appendChild(el('line',{x1:o.x,y1:0,x2:o.x,y2:h,stroke:'var(--grid-axis)','stroke-width':1.4}));}
  function drawOrigin(){const p=worldToScreen(0,0),g=el('g',{});g.appendChild(el('circle',{cx:p.x,cy:p.y,r:16,fill:'none',stroke:'var(--accent)','stroke-width':1,'stroke-dasharray':'2,3',opacity:0.5}));g.appendChild(el('circle',{cx:p.x,cy:p.y,r:7,fill:'var(--accent)',stroke:'#1a1305','stroke-width':1.5}));g.appendChild(el('circle',{cx:p.x,cy:p.y,r:2.2,fill:'#1a1305'}));const label=el('text',{x:p.x,y:p.y+24,'text-anchor':'middle',fill:'var(--accent)','font-size':10,'font-family':"'JetBrains Mono',monospace",class:'obj-label','font-weight':600});label.textContent='PLAYER · ORIGIN';g.appendChild(label);svg.appendChild(g);}
  function drawObject(obj){const c=worldToScreen(obj.position.x,obj.position.y),hpx=obj.size.y*view.scale,wpx=obj.size.x*view.scale,x0=c.x-wpx/2,y0=c.y-hpx/2,isSel=obj.id===selectedId,imgHeight=hpx,imgWidth=imgHeight*(obj.imageAspect||1),g=el('g',{'data-id':obj.id,style:'cursor:grab;'});if(obj.imageData){g.appendChild(el('image',{x:c.x-imgWidth/2,y:y0,width:imgWidth,height:imgHeight,href:obj.imageData}));g.appendChild(el('rect',{x:x0,y:y0,width:wpx,height:hpx,fill:'none',stroke:isSel?'var(--accent)':'rgba(255,255,255,0.12)','stroke-width':isSel?2:1}));}else{g.appendChild(el('rect',{x:x0,y:y0,width:wpx,height:hpx,fill:isSel?'var(--accent-soft)':'rgba(255,255,255,0.03)',stroke:isSel?'var(--accent)':'rgba(255,255,255,0.18)','stroke-width':isSel?2:1,'stroke-dasharray':isSel?'none':'4,3'}));const t=el('text',{x:c.x,y:c.y+4,'text-anchor':'middle',fill:'var(--text-dim)','font-size':10,class:'obj-label'});t.textContent=(obj.title||'?').slice(0,14);g.appendChild(t);}if(flags.showColliders&&(obj.colliderSize.x>0||obj.colliderSize.y>0)){const cc=worldToScreen(obj.position.x+obj.colliderOffset.x*obj.size.x,obj.position.y+obj.colliderOffset.y*obj.size.y),cwpx=obj.colliderSize.x*wpx,chpx=obj.colliderSize.y*hpx;if(obj.colliderShape==='circle')g.appendChild(el('ellipse',{cx:cc.x,cy:cc.y,rx:cwpx/2,ry:chpx/2,fill:'var(--collider)','fill-opacity':0.08,stroke:'var(--collider)','stroke-width':1.2,'stroke-dasharray':'4,3'}));else g.appendChild(el('rect',{x:cc.x-cwpx/2,y:cc.y-chpx/2,width:cwpx,height:chpx,fill:'var(--collider)','fill-opacity':0.08,stroke:'var(--collider)','stroke-width':1.2,'stroke-dasharray':'4,3'}));}if(flags.showTriggers&&(obj.triggerSize.x>0||obj.triggerSize.y>0)){const tc=worldToScreen(obj.position.x+obj.triggerOffset.x*obj.size.x,obj.position.y+obj.triggerOffset.y*obj.size.y),twpx=obj.triggerSize.x*wpx,thpx=obj.triggerSize.y*hpx;g.appendChild(el('rect',{x:tc.x-twpx/2,y:tc.y-thpx/2,width:twpx,height:thpx,fill:'var(--trigger)','fill-opacity':0.06,stroke:'var(--trigger)','stroke-width':1.2,'stroke-dasharray':'2,3'}));}const hideC=worldToScreen(obj.position.x,obj.position.y+obj.hideCriteria);g.appendChild(el('line',{x1:c.x-wpx/2,y1:hideC.y,x2:c.x+wpx/2,y2:hideC.y,stroke:'var(--danger)','stroke-width':2,'stroke-dasharray':'5,3',opacity:0.85}));if(isSel)g.appendChild(el('rect',{x:x0-4,y:y0-4,width:wpx+8,height:hpx+8,fill:'none',stroke:'var(--accent)','stroke-width':1,'stroke-dasharray':'3,3',opacity:0.6}));const lbl=el('text',{x:c.x,y:y0-8,'text-anchor':'middle',fill:isSel?'var(--accent)':'var(--text-muted)','font-size':10.5,'font-weight':isSel?700:500,class:'obj-label'});lbl.textContent=obj.title||'Untitled';g.appendChild(lbl);g.addEventListener('mousedown',e=>onObjectMouseDown(e,obj));svg.appendChild(g);}
  function onObjectMouseDown(e,obj){e.stopPropagation();selectObject(obj.id);const p=eventToSvgPoint(e),w=screenToWorld(p.x,p.y);drag={id:obj.id,offX:obj.position.x-w.x,offY:obj.position.y-w.y};}
  svg.addEventListener('mousedown',e=>{if(e.target===svg||e.target.tagName==='line'){selectObject(null);panning={startX:e.clientX,startY:e.clientY,panX0:view.panX,panY0:view.panY};svg.classList.add('panning');}});
  window.addEventListener('mousemove',e=>{const p=eventToSvgPoint(e),w=screenToWorld(p.x,p.y);document.getElementById('curX').textContent=w.x.toFixed(2);document.getElementById('curY').textContent=w.y.toFixed(2);if(drag){const obj=objects.find(o=>o.id===drag.id);if(obj){let nx=w.x+drag.offX,ny=w.y+drag.offY;if(flags.snap){nx=Math.round(nx*2)/2;ny=Math.round(ny*2)/2;}obj.position.x=round2(nx);obj.position.y=round2(ny);render();if(selectedId===obj.id)refreshPropsValuesOnly(obj);}}else if(panning){view.panX=panning.panX0+(e.clientX-panning.startX);view.panY=panning.panY0+(e.clientY-panning.startY);render();}});
  window.addEventListener('mouseup',()=>{if(drag){drag=null;autosave();}if(panning){panning=null;svg.classList.remove('panning');}});
  svg.addEventListener('wheel',e=>{e.preventDefault();const p=eventToSvgPoint(e),before=screenToWorld(p.x,p.y),factor=e.deltaY<0?1.12:1/1.12;view.scale=Math.min(240,Math.max(8,view.scale*factor));const after=worldToScreen(before.x,before.y);view.panX+=p.x-after.x;view.panY+=p.y-after.y;render();},{passive:false});
  document.getElementById('zoomIn').onclick=()=>{view.scale=Math.min(240,view.scale*1.2);render();};document.getElementById('zoomOut').onclick=()=>{view.scale=Math.max(8,view.scale/1.2);render();};document.getElementById('zoomReset').onclick=()=>{view.scale=40;view.panX=0;view.panY=0;render();};
  window.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)||!selectedId)return;const obj=objects.find(o=>o.id===selectedId);if(!obj)return;const step=e.shiftKey?1:0.1;let moved=true;if(e.key==='ArrowLeft')obj.position.x=round2(obj.position.x-step);else if(e.key==='ArrowRight')obj.position.x=round2(obj.position.x+step);else if(e.key==='ArrowUp')obj.position.y=round2(obj.position.y+step);else if(e.key==='ArrowDown')obj.position.y=round2(obj.position.y-step);else if(e.key==='Delete'||e.key==='Backspace'){deleteObject(obj.id);moved=false;}else moved=false;if(moved){e.preventDefault();render();refreshPropsValuesOnly(obj);autosave();}});window.addEventListener('resize',resize);
  function renderList(){const list=document.getElementById('objList');document.getElementById('objCount').textContent=objects.length;list.innerHTML='';if(objects.length===0){list.innerHTML='<div class="empty-hint">No objects yet.<br>Click "+ New Object" to begin.</div>';return;}for(const obj of [...objects].sort((a,b)=>(a.sortingOrder||0)-(b.sortingOrder||0))){const item=document.createElement('div');item.className='obj-item'+(obj.id===selectedId?' selected':'');const thumb=document.createElement('div');thumb.className='obj-thumb';if(obj.imageData)thumb.style.backgroundImage=`url(${obj.imageData})`;else thumb.textContent='—';const info=document.createElement('div');info.className='obj-info';info.innerHTML=`<div class="obj-title">${escapeHtml(obj.title||'Untitled')}</div><div class="obj-meta">#${obj.sortingOrder} · ${obj.position.x.toFixed(1)}, ${obj.position.y.toFixed(1)}</div>`;const del=document.createElement('div');del.className='obj-del';del.innerHTML='✕';del.onclick=e=>{e.stopPropagation();deleteObject(obj.id);};item.append(thumb,info,del);item.onclick=()=>selectObject(obj.id);list.appendChild(item);}}
  function escapeHtml(s){return(s+'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));} function escapeAttr(s){return(s+'').replace(/"/g,'&quot;');}
  function selectObject(id){selectedId=id;render();renderList();renderProps();} function deleteObject(id){const obj=objects.find(o=>o.id===id);if(!obj)return;if(!confirm(`Delete "${obj.title||'this object'}"? This can't be undone.`))return;objects=objects.filter(o=>o.id!==id);if(selectedId===id)selectedId=null;render();renderList();renderProps();autosave();showToast('Object deleted');}
  function duplicateObject(id){const obj=objects.find(o=>o.id===id);if(!obj)return;const copy=normalizeObjectImage(JSON.parse(JSON.stringify(obj)));copy.id=uid();copy.title=obj.title+' Copy';copy.position={x:round2(obj.position.x+1),y:round2(obj.position.y-1)};copy.sortingOrder=nextSortOrder();objects.push(copy);selectObject(copy.id);autosave();showToast('Object duplicated');}
  function renderProps(){const wrap=document.getElementById('props'),obj=objects.find(o=>o.id===selectedId);if(!obj){wrap.innerHTML='<div class="prop-empty">Select an object on the canvas or in the list to edit its properties.<br><br>Or click <b style="color:var(--text-muted)">+ New Object</b> to create one.</div>';return;}wrap.innerHTML=`
    <div class="sprite-row"><div class="sprite-preview" id="spritePreview" title="Click to upload sprite">${obj.imageData?'':'no sprite'}</div><div class="sprite-actions"><div class="mini-btn" id="btnUploadSprite">Upload sprite…</div><div class="mini-btn" id="btnClearSprite" style="${obj.imageData?'':'display:none'}">Remove sprite</div></div></div>
    <div class="field"><label>Title</label><input type="text" id="f_title" value="${escapeAttr(obj.title)}"><div class="hint">"Map1/"으로 시작해주세요.</div><div class="hint">띄어쓰기 대신 _를 사용해주세요.</div></div>
    <div class="fieldgroup"><div class="fieldgroup-title"><span class="dot" style="background:var(--accent)"></span>Transform</div><div class="row2"><div class="field"><label>Position X</label><input type="number" step="0.1" id="f_posx" value="${obj.position.x}"></div><div class="field"><label>Position Y</label><input type="number" step="0.1" id="f_posy" value="${obj.position.y}"></div></div><div class="row2"><div class="field"><label>Size X</label><input type="number" step="0.1" min="0.05" id="f_sizex" value="${obj.size.x}"></div><div class="field"><label>Size Y</label><input type="number" step="0.1" min="0.05" id="f_sizey" value="${obj.size.y}"></div></div><div class="hint">빈 오브젝트가 아닌 이미지가 포함된 오브젝트의 경우 Size X:Size Y의 비율은 가급적 변경하지 말고 유지해주세요.</div><div class="hint">Tip: drag the object on the canvas, or nudge with arrow keys (hold Shift for larger steps).</div></div>
    <div class="fieldgroup"><div class="fieldgroup-title"><span class="dot" style="background:var(--trigger)"></span>Trigger</div><div class="row2"><div class="field"><label>Size X</label><input type="number" step="0.05" id="f_trigsizex" value="${obj.triggerSize.x}"></div><div class="field"><label>Size Y</label><input type="number" step="0.05" id="f_trigsizey" value="${obj.triggerSize.y}"></div></div><div class="row2"><div class="field"><label>Offset X</label><input type="number" step="0.05" id="f_trigoffx" value="${obj.triggerOffset.x}"></div><div class="field"><label>Offset Y</label><input type="number" step="0.05" id="f_trigoffy" value="${obj.triggerOffset.y}"></div></div><div class="hint">Tip: Trigger Size는 x, y 모두 양수여야 합니다.</div></div>
    <div class="fieldgroup"><div class="fieldgroup-title"><span class="dot" style="background:var(--collider)"></span>Collider</div><div class="field"><label>Shape</label><select id="f_colshape"><option value="box" ${obj.colliderShape==='box'?'selected':''}>Box</option><option value="circle" ${obj.colliderShape==='circle'?'selected':''}>Circle</option></select></div><div class="row2"><div class="field"><label>Size X</label><input type="number" step="0.05" id="f_colsizex" value="${obj.colliderSize.x}"></div><div class="field"><label>Size Y</label><input type="number" step="0.05" id="f_colsizey" value="${obj.colliderSize.y}"></div></div><div class="row2"><div class="field"><label>Offset X</label><input type="number" step="0.05" id="f_coloffx" value="${obj.colliderOffset.x}"></div><div class="field"><label>Offset Y</label><input type="number" step="0.05" id="f_coloffy" value="${obj.colliderOffset.y}"></div></div><div class="hint">Tip: Collider Size는 음수가 될 수 없으며, 물리적 방해가 필요없는 물체의 경우 둘 다 0으로 설정하면 됩니다.</div></div>
    <div class="fieldgroup"><div class="fieldgroup-title"><span class="dot" style="background:var(--text-muted)"></span>Behavior</div><div class="row2"><div class="field"><label>Hide criteria</label><input type="number" step="0.1" id="f_hide" value="${obj.hideCriteria}"></div><div class="field"><label>Sorting order</label><input type="number" step="1" id="f_sort" value="${obj.sortingOrder}"></div></div><div class="field"><label><input type="checkbox" id="f_touch"> Manually touchable</label></div><div class="field"><label>Script</label><input type="text" id="f_script" value="${escapeAttr(obj.script)}" placeholder="e.g. Inv_InteractionObj_Map1_Houses"></div><div class="hint">Criteria는 잘 조절해서 주황색 선이 바닥/발에 가도록 해주시면 됩니다.</div><div class="hint">Criteria는 ColliderSize가 0으로 존재하지 않을때는 필요하지 않습니다.</div><div class="hint">Sorting Order는 높을수록 겹쳐 있을 때 앞에 위치합니다.</div><div class="hint">(Player가 100으로 되어 있는 건 무시하시고, 나머지는 모두 0이상 100 미만의 짝수로 설정해주세요)</div><div class="hint">Sorting Order는 적어주지 않으셔도 무방합니다.</div><div class="hint">Script 부분은 제가 작성합니다.</div></div>
    <div class="prop-actions"><div class="tbtn" id="btnDuplicate">Duplicate</div><div class="tbtn danger" id="btnDelete">Delete</div></div>`;
    if(obj.imageData)document.getElementById('spritePreview').style.backgroundImage=`url(${obj.imageData})`;document.getElementById('f_touch').checked=!!obj.manually_touchable;bindPropEvents(obj);}
  function bindPropEvents(obj){const g=id=>document.getElementById(id),bindText=(id,path)=>g(id).addEventListener('input',()=>{setPath(obj,path,g(id).value);render();renderList();autosave();}),bindNum=(id,path)=>g(id).addEventListener('input',()=>{const v=parseFloat(g(id).value);setPath(obj,path,isNaN(v)?0:v);render();renderList();autosave();});bindText('f_title','title');bindNum('f_posx','position.x');bindNum('f_posy','position.y');bindNum('f_sizex','size.x');bindNum('f_sizey','size.y');g('f_colshape').addEventListener('change',()=>{obj.colliderShape=g('f_colshape').value;render();autosave();});bindNum('f_colsizex','colliderSize.x');bindNum('f_colsizey','colliderSize.y');bindNum('f_coloffx','colliderOffset.x');bindNum('f_coloffy','colliderOffset.y');bindNum('f_trigsizex','triggerSize.x');bindNum('f_trigsizey','triggerSize.y');bindNum('f_trigoffx','triggerOffset.x');bindNum('f_trigoffy','triggerOffset.y');bindNum('f_hide','hideCriteria');bindNum('f_sort','sortingOrder');bindText('f_script','script');g('f_touch').addEventListener('change',()=>{obj.manually_touchable=g('f_touch').checked;autosave();});g('btnUploadSprite').onclick=()=>promptSpriteUpload(obj);g('spritePreview').onclick=()=>promptSpriteUpload(obj);g('btnClearSprite').onclick=()=>{obj.imageData=null;render();renderProps();renderList();autosave();};g('btnDuplicate').onclick=()=>duplicateObject(obj.id);g('btnDelete').onclick=()=>deleteObject(obj.id);}
  function setPath(obj,path,value){const parts=path.split('.');let t=obj;for(let i=0;i<parts.length-1;i++)t=t[parts[i]];t[parts[parts.length-1]]=value;} function refreshPropsValuesOnly(obj){const px=document.getElementById('f_posx'),py=document.getElementById('f_posy');if(px)px.value=obj.position.x;if(py)py.value=obj.position.y;}
  let spriteTargetObj=null;const fileSprite=document.getElementById('fileSprite');function promptSpriteUpload(obj){spriteTargetObj=obj;fileSprite.click();}fileSprite.addEventListener('change',e=>{const file=e.target.files[0];if(!file||!spriteTargetObj)return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{spriteTargetObj.imageData=reader.result;spriteTargetObj.size.x=1;spriteTargetObj.size.y=1;spriteTargetObj.imageAspect=img.width/img.height;spriteTargetObj.image=[];render();renderProps();renderList();autosave();showToast('Sprite attached');};img.src=reader.result;};reader.readAsDataURL(file);fileSprite.value='';});
  document.getElementById('btnNew').onclick=()=>{const center=screenToWorld(svg.getBoundingClientRect().width/2,svg.getBoundingClientRect().height/2),obj=defaultObject({x:round2(center.x),y:round2(center.y)});objects.push(obj);selectObject(obj.id);autosave();setTimeout(()=>{const t=document.getElementById('f_title');if(t){t.focus();t.select();}},30);};
  function wireToggle(id,flagKey){const wrap=document.getElementById(id),cb=wrap.querySelector('input');cb.checked=flags[flagKey];wrap.classList.toggle('on',flags[flagKey]);wrap.addEventListener('click',e=>{e.preventDefault();flags[flagKey]=!flags[flagKey];cb.checked=flags[flagKey];wrap.classList.toggle('on',flags[flagKey]);render();});}wireToggle('toggleGrid','showGrid');wireToggle('toggleColliders','showColliders');wireToggle('toggleTriggers','showTriggers');wireToggle('toggleSnap','snap');
  function toGameJson(){const sorted=[...objects].filter(o=>o.title!=="Player").sort((a,b)=>(a.sortingOrder||0)-(b.sortingOrder||0));return{title:mapTitle,interactables:sorted.map(o=>({title:o.title,position:{x:round2(o.position.x),y:round2(o.position.y)},size:{x:o.size.x,y:o.size.y},colliderShape:o.colliderShape,colliderSize:{x:o.colliderSize.x,y:o.colliderSize.y},colliderOffset:{x:o.colliderOffset.x,y:o.colliderOffset.y},triggerSize:{x:o.triggerSize.x,y:o.triggerSize.y},triggerOffset:{x:o.triggerOffset.x,y:o.triggerOffset.y},hideCriteria:o.hideCriteria,sortingOrder:o.sortingOrder,image:[],script:o.script,manually_touchable:!!o.manually_touchable}))};}
  function download(filename,content,mime){const blob=new Blob([content],{type:mime||'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),2000);}
  document.getElementById('btnExportGame').onclick=()=>{if(objects.length===0){showToast('Nothing to export yet');return;}download('map_export.json',JSON.stringify(toGameJson(),null,2));showToast('Game JSON exported');};
  document.getElementById('btnImportGame').onclick=()=>document.getElementById('fileGameJson').click();document.getElementById('fileGameJson').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result),arr=Array.isArray(data)?data:data.interactables;if(!Array.isArray(arr))throw new Error('Expected a JSON array or map object');mapTitle=data.title??mapTitle;document.getElementById('projName').value=mapTitle;const imported=arr.map(d=>{const o=defaultObject({x:0,y:0});Object.assign(o,{title:d.title??'Untitled',position:{x:d.position?.x??0,y:d.position?.y??0},size:{x:d.size?.x??1,y:d.size?.y??1},colliderShape:d.colliderShape??'box',colliderSize:{x:d.colliderSize?.x??0,y:d.colliderSize?.y??0},colliderOffset:{x:d.colliderOffset?.x??0,y:d.colliderOffset?.y??0},triggerSize:{x:d.triggerSize?.x??0,y:d.triggerSize?.y??0},triggerOffset:{x:d.triggerOffset?.x??0,y:d.triggerOffset?.y??0},hideCriteria:d.hideCriteria??0,sortingOrder:d.sortingOrder??0,image:[],script:d.script??'',manually_touchable:d.manually_touchable??false});o.id=uid();o.imageData=null;return o;});if(objects.length===0||confirm(`Import ${imported.length} object(s)? This replaces the current map (sprites will need to be re-attached since game JSON doesn't store images).`)){objects=imported;selectedId=null;render();renderList();renderProps();autosave();showToast(`Imported ${imported.length} object(s)`);}}catch(err){alert('Could not read this file as map JSON: '+err.message);}document.getElementById('fileGameJson').value='';};reader.readAsText(file);});
  document.getElementById('btnSaveProject').onclick=()=>{objects.forEach(normalizeObjectImage);const payload={version:1,savedAt:new Date().toISOString(),mapTitle,objects};download('map_project.mapproj.json',JSON.stringify(payload));showToast('Project saved');};document.getElementById('btnLoadProject').onclick=()=>document.getElementById('fileProject').click();document.getElementById('fileProject').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result),objs=Array.isArray(data)?data:data.objects;if(!Array.isArray(objs))throw new Error('Unrecognized project file');if(objects.length===0||confirm(`Load "${file.name}"? This replaces the current map.`)){objects=objs.map(o=>normalizeObjectImage({...defaultObject({x:0,y:0}),...o,id:o.id||uid()}));selectedId=null;nextLocalId+=objects.length+1;mapTitle=data.mapTitle??"Map1";document.getElementById('projName').value=mapTitle;render();renderList();renderProps();autosave();showToast('Project loaded');}}catch(err){alert('Could not load project: '+err.message);}document.getElementById('fileProject').value='';};reader.readAsText(file);});
  let autosaveTimer=null;function autosave(){clearTimeout(autosaveTimer);autosaveTimer=setTimeout(()=>{try{objects.forEach(normalizeObjectImage);localStorage.setItem('mapEditorAutosave',JSON.stringify({mapTitle,objects,savedAt:Date.now()}));}catch(err){console.warn('Autosave failed (storage full?)',err);document.getElementById('statusMsg').textContent='Autosave failed — save your project manually.';}},400);}function tryRestore(){try{const raw=localStorage.getItem('mapEditorAutosave');if(!raw)return;const data=JSON.parse(raw);if(data.objects&&data.objects.length){mapTitle=data.mapTitle??"Map1";document.getElementById('projName').value=mapTitle;objects=data.objects.map(o=>normalizeObjectImage({...defaultObject({x:0,y:0}),...o,id:o.id||uid()}));nextLocalId+=objects.length+1;showToast('Restored your last session');}}catch(err){}}
  let toastTimer=null;function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);}
  tryRestore();resize();renderList();renderProps();new ResizeObserver(resize).observe(svg);
})();
</script>
